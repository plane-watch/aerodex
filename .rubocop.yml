Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

# Without this, the `Exclude` list below would replace RuboCop's built-in
# defaults rather than extend them, silently re-admitting `node_modules`,
# `tmp`, `vendor` and `.git`. That matters because CI installs gems into
# `vendor/bundle`, so a full-repository run would otherwise lint every gem.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.3
  NewCops: pending
  Exclude:
    # These patterns are resolved against the directory RuboCop treats as the
    # project root, which it finds via the outermost Gemfile above the working
    # directory. That is the repository root for an ordinary clone and for CI.
    # It is not the repository root for a working copy checked out *inside*
    # another clone, such as a git worktree under `.claude/worktrees/`, where
    # the outer Gemfile wins and these patterns stop matching. Run RuboCop from
    # a checkout that is not nested inside another clone to reproduce CI.
    - 'db/schema.rb'
    # The binstubs are generated by Bundler and `rails app:update`, so any
    # correction made here is discarded the next time they are regenerated.
    - 'bin/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'lib/tasks/**/*'

# Both cops report on size alone. The processors and importers they flag are
# long because they enumerate fields and sources, not because they carry
# proportionate complexity, so satisfying them would mean splitting classes to
# suit a line count rather than a responsibility. `Metrics/BlockLength` and
# `Metrics/BlockNesting` stay enabled: those report local complexity, which is
# worth acting on.
Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

# The offences here are fixed-width tables written to the console and to the
# log, such as `format('%-36s %-15s %-30s %s', ...)`. Annotating each token
# would separate the format string from its arguments and make the column
# widths harder to read, without adding safety at this number of arguments.
Style/FormatStringToken:
  MaxUnannotatedPlaceholdersAllowed: 5

# The three cops below ship enabled in the base `rubocop` gem, whose defaults
# target gems rather than Rails applications. Rails' own style guide
# (`rubocop-rails-omakase`) disables all three, and the conventions they
# enforce do not hold for generated Rails code such as migrations.

# Requires a comment above every class and module. Applied to a Rails
# application this rewards a restatement of the class name rather than useful
# documentation, and every generated migration defines an undocumented class.
Style/Documentation:
  Enabled: false

# Requires a `# frozen_string_literal: true` magic comment in every file.
# Rails does not use these comments in the code it generates.
Style/FrozenStringLiteralComment:
  Enabled: false

# Enforces nested `module Foo` / `class Bar` over the compact `class Foo::Bar`.
# Both forms appear in this codebase and the distinction carries no meaning
# here beyond constant lookup, which the compact form makes explicit.
Style/ClassAndModuleChildren:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: single_quotes

Style/TrailingCommaInHashLiteral:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Layout/LineLength:
  Max: 120
